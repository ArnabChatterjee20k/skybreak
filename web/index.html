<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Skybreak</title>
<style>
:root { --sky: #0b1430; --glow: #6fd3ff; --ember: #ff8a3d; --text: #e8f1ff; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: var(--sky); color: var(--text); overflow: hidden; touch-action: none;
	font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#cover { position: absolute; inset: 0; display: flex; flex-direction: column;
	align-items: center; justify-content: center; gap: 1.5rem; z-index: 1;
	background: radial-gradient(ellipse at 50% 110%, #2a3f86 0%, var(--sky) 60%, #050913 100%); }
#title { font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; letter-spacing: 0.3em;
	margin: 0 0 0 0.3em; background: linear-gradient(180deg, #fff 20%, var(--glow) 60%, var(--ember));
	-webkit-background-clip: text; background-clip: text; color: transparent;
	filter: drop-shadow(0 0 18px rgba(111, 211, 255, 0.45)); }
#bar { width: min(420px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
#fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--glow), var(--ember)); transition: width 0.15s; }
#label { font-size: 0.95rem; opacity: 0.8; min-height: 1.2em; text-align: center; white-space: pre-line; }
#start { font: inherit; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.15em; color: var(--sky);
	background: var(--glow); border: 0; border-radius: 999px; padding: 0.8rem 2.4rem; cursor: pointer;
	box-shadow: 0 0 24px rgba(111, 211, 255, 0.6); }
#start:hover { background: #fff; }
#start[hidden] { display: none; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Skybreak needs JavaScript.</noscript>
<div id="cover">
	<h1 id="title">SKYBREAK</h1>
	<div id="bar"><div id="fill"></div></div>
	<div id="label">Loading…</div>
	<button id="start" type="button" hidden>CLICK TO START</button>
</div>
<script src="boot_cache.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":56888744,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

// Brings the cached build up to date (sw.js, boot_cache.js), then loads the engine script.
function skybreakBoot() {
	const fill = document.getElementById('fill');
	const label = document.getElementById('label');
	const ui = {
		status: (text) => { label.textContent = text; },
		progress: (done, total) => {
			fill.style.width = total > 0 ? (100 * done / total).toFixed(1) + '%' : '0%';
			label.textContent = 'Updating ' + (done / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
		},
	};
	const cached = typeof SkybreakCache === 'undefined' ? Promise.resolve({ mode: 'network', why: 'no boot_cache.js' })
		: SkybreakCache.boot(ui).catch((e) => ({ mode: 'network', why: String(e) }));
	return cached.then((r) => {
		window.skybreakBootResult = r;
		console.log('Skybreak boot: ' + JSON.stringify(r));
		if (r.mode === 'reload') {
			location.reload();
			return new Promise(() => {});
		}
		fill.style.width = '0%';
		label.textContent = 'Loading…';
		return new Promise((resolve, reject) => {
			const s = document.createElement('script');
			s.src = 'index.js';
			s.onload = resolve;
			s.onerror = () => reject(new Error('could not load index.js'));
			document.body.appendChild(s);
		});
	});
}

skybreakBoot().then(function () {
	const cover = document.getElementById('cover');
	const fill = document.getElementById('fill');
	const label = document.getElementById('label');
	const startButton = document.getElementById('start');
	let loaded = false;
	let clicked = false;
	let failed = false;

	function fail(err) {
		console.error(err);
		failed = true;
		startButton.hidden = true;
		label.textContent = 'Could not start Skybreak:\n' + (err && err.message ? err.message : String(err));
	}

	function megabytes(bytes) {
		return (bytes / 1048576).toFixed(1) + ' MB';
	}

	// Starts once the files are in and the player has clicked (the click unlocks audio).
	function maybeStart() {
		if (!loaded || !clicked || failed) {
			return;
		}
		label.textContent = 'Starting…';
		engine.start().then(() => cover.remove(), fail);
	}

	// The engine already cancels key, wheel and mouse defaults on the canvas. Browser-reserved
	// shortcuts (Ctrl+W/T/N/Tab on Windows and Linux) can only be captured with Keyboard Lock,
	// which browsers allow in fullscreen; Esc then needs a long press to leave fullscreen.
	document.addEventListener('fullscreenchange', () => {
		if (!navigator.keyboard || !navigator.keyboard.lock) {
			return;
		}
		if (document.fullscreenElement) {
			navigator.keyboard.lock().catch(() => {});
		} else {
			navigator.keyboard.unlock();
		}
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('This browser is missing: ' + missing.join(', ') + '. Try a recent Chrome, Edge or Firefox.'));
		return;
	}

	startButton.hidden = false;
	startButton.addEventListener('click', () => {
		clicked = true;
		startButton.hidden = true;
		// Opening a context inside the gesture gives the page sticky audio activation.
		const AudioCtx = window.AudioContext || window.webkitAudioContext;
		if (AudioCtx) {
			const ctx = new AudioCtx();
			ctx.resume().finally(() => ctx.close());
		}
		label.textContent = loaded ? 'Starting…' : 'Loading…';
		maybeStart();
	});

	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || exe + '.pck';
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []),
		onProgress: (current, total) => {
			if (current > 0 && total > 0) {
				fill.style.width = (100 * current / total).toFixed(1) + '%';
				if (!clicked) {
					label.textContent = 'Loading ' + megabytes(current) + ' / ' + megabytes(total);
				}
			}
		},
	}));
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
		loaded = true;
		fill.style.width = '100%';
		if (!clicked) {
			label.textContent = 'Ready';
		}
		maybeStart();
	}, fail);
}, function (err) {
	console.error(err);
	document.getElementById('start').hidden = true;
	document.getElementById('label').textContent = 'Could not start Skybreak:\n' + err.message;
});
</script>
</body>
</html>
